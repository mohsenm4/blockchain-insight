services:
  blockchain:
    build: .
    ports:
      - "5050:5050"
    volumes:
      - ./app.env:/app/app.env:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: insight
      POSTGRES_PASSWORD: insight
      POSTGRES_DB: ledger
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insight -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
