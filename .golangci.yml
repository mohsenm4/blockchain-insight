version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unparam
    - unused
    # bugs in money and SQL code
    - bodyclose
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - gocritic
    - gosec
    - makezero
    - nilerr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - wastedassign
  settings:
    gocritic:
      disabled-checks:
        # main and cmd/tools exit on a startup error; skipping their defers
        # (signal.NotifyContext's stop) does no harm there
        - exitAfterDefer
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # tests build requests and listeners without a context, convert small
      # known numbers, and their fake servers may ignore write errors
      - path: _test\.go
        linters:
          - errchkjson
          - gosec
          - noctx
    paths:
      - docs
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - docs
      - third_party$
      - builtin$
      - examples$
